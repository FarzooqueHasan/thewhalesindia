<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="whale-glow-gradient" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00f0ff" />
      <stop offset="0.5" stop-color="#0077ff" />
      <stop offset="1" stop-color="#00ffd1" />
    </linearGradient>
    <linearGradient id="whale-body-grad" x1="40" y1="110" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00e5ff" stop-opacity="0.95" />
      <stop offset="1" stop-color="#0a4d8c" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="86" stroke="url(#whale-glow-gradient)" stroke-width="6.5" fill="#040814" />

  <!-- Atom -->
  <g transform="translate(92, 58)">
    <circle cx="0" cy="0" r="3.5" fill="#00ffcc" />
    <ellipse cx="0" cy="0" rx="6.5" ry="16" stroke="#ffffff" stroke-width="2.2" fill="none" />
    <ellipse cx="0" cy="0" rx="6.5" ry="16" stroke="#ffffff" stroke-width="2.2" fill="none" transform="rotate(60)" />
    <ellipse cx="0" cy="0" rx="6.5" ry="16" stroke="#ffffff" stroke-width="2.2" fill="none" transform="rotate(-60)" />
  </g>

  <!-- Rocket -->
  <g transform="translate(126, 68) rotate(42)">
    <path d="M0,-18 C5,-10 6,0 6,8 L-6,8 C-6,0 -5,-10 0,-18 Z" fill="#ffffff" />
    <circle cx="0" cy="-2" r="2.2" fill="#040814" />
    <path d="M-6,3 L-11,8 L-6,8 Z" fill="#ffffff" />
    <path d="M6,3 L11,8 L6,8 Z" fill="#ffffff" />
    <path d="M-3,9 L0,15 L3,9 Z" fill="#00ffcc" />
  </g>

  <!-- Laptop with Code -->
  <g transform="translate(78, 104)">
    <rect x="-24" y="-30" width="48" height="32" rx="3" stroke="#ffffff" stroke-width="3" fill="#040d1e" />
    <path d="M-9,-18 L-14,-14 L-9,-10" stroke="#00ffcc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="2" y1="-20" x2="-2" y2="-8" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
    <path d="M9,-18 L14,-14 L9,-10" stroke="#00ffcc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M-28,2 L28,2 L24,5 L-24,5 Z" fill="#ffffff" />
    <rect x="-4" y="2.5" width="8" height="1.5" rx="0.5" fill="#040814" />
  </g>

  <!-- Robot Rover -->
  <g transform="translate(128, 102)">
    <line x1="0" y1="-17" x2="0" y2="-23" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="-24" r="2" fill="#00ffcc" />
    <rect x="-8" y="-17" width="16" height="7" rx="2" fill="#ffffff" />
    <circle cx="-3" cy="-13.5" r="1.2" fill="#040814" />
    <circle cx="3" cy="-13.5" r="1.2" fill="#040814" />
    <rect x="-10" y="-9" width="20" height="10" rx="2" fill="#ffffff" />
    <path d="M-10,-5 L-14,-5 L-14,-1" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M10,-5 L14,-5 L14,-1" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <rect x="-12" y="2" width="24" height="6" rx="3" stroke="#ffffff" stroke-width="1.8" fill="#040814" />
    <circle cx="-7" cy="5" r="1.5" fill="#00ffcc" />
    <circle cx="0" cy="5" r="1.5" fill="#00ffcc" />
    <circle cx="7" cy="5" r="1.5" fill="#00ffcc" />
  </g>

  <!-- The Whale -->
  <path d="M52,112 L126,112 C132,112 136,115 138,119 C142,115 146,112 153,113 C158,114 160,119 157,125 C153,130 148,131 144,130 C145,134 143,142 136,146 C126,153 108,154 94,151 C74,147 58,136 52,122 Z" fill="url(#whale-body-grad)" />
  <path d="M138,119 C142,112 150,110 156,112 C159,114 158,121 154,124 C148,127 143,124 140,128 C142,133 147,136 153,134 C156,133 158,138 154,141 C148,144 140,140 137,131 Z" fill="#00ffcc" opacity="0.9" />
  <circle cx="79" cy="126" r="2.4" fill="#ffffff" />
  <circle cx="79.5" cy="125.8" r="1.2" fill="#040814" />
  <path d="M86,134 C94,136 102,145 99,150 C95,152 90,148 85,140 Z" fill="#ffffff" />
  <path d="M58,130 C68,143 85,150 102,151" stroke="#00ffcc" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85" />
</svg>
